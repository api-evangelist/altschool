name: AltSchool
description: >-
  AltSchool was an American education-technology company founded in 2013 by former Google
  executive Max Ventilla to build a network of small private "lab" schools around a personalized,
  student-directed learning model, using those campuses to develop a K-12 software platform for
  assignments and progress tracking. It raised more than $170 million from investors including
  Founders Fund, Andreessen Horowitz (a16z), Mark Zuckerberg's CZI, and Peter Thiel. In 2017-2019
  the company closed or handed off its for-profit schools (to Higher Ground Education) and pivoted
  to selling the software as "Altitude Learning," with Ventilla stepping down as CEO. The venture is
  now defunct as an independent operation: the altschool.com domain no longer resolves and
  altitudelearning.com redirects to Guidepost Montessori. No public developer, API, or documentation
  surface was found; this record is retained as a historical VC-portfolio company profile.
